name: Editorial OS V12.18 nonblocking vendor patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v1218-nonblocking.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>', '<script async src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>')
          s=s.replace('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>', '<script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>')
          marker='<script src="./supabase-config.js"></script>'
          boot='<script src="./js/v1218-bootstrap.js?v=12.18"></script>\n'
          if boot not in s:
              s=s.replace(marker, boot+marker)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Editorial OS V12.18 - make external vendors nonblocking'
          git push
