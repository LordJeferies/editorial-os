name: Editorial OS V12.20 iPhone first production patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v1220-iphone.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vendor browser dependencies locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl -fL --retry 3 --connect-timeout 10 'https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js' -o vendor/sortable.min.js
          curl -fL --retry 3 --connect-timeout 10 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2' -o vendor/supabase.min.js
          test -s vendor/sortable.min.js
          test -s vendor/supabase.min.js

      - name: Patch index, manifest and service worker
        shell: python
        run: |
          from pathlib import Path
          import json, re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('./js/v1218-bootstrap.js?v=12.18', './js/v1220-bootstrap.js?v=12.20')
          html = re.sub(r'\s*<script[^>]+src=["\']https://cdn\.jsdelivr\.net/npm/sortablejs@1\.15\.6/Sortable\.min\.js["\'][^>]*></script>', '', html, flags=re.I)
          html = re.sub(r'\s*<script[^>]+src=["\']https://cdn\.jsdelivr\.net/npm/@supabase/supabase-js@2["\'][^>]*></script>', '', html, flags=re.I)
          if './css/v1220.css?v=12.20' not in html:
              html = html.replace('</head>', '<link rel="stylesheet" href="./css/v1220.css?v=12.20">\n</head>', 1)
          if './js/v1220-runtime.js?v=12.20' not in html:
              html = html.replace('<script type="module" src="./js/v12-glass.js"></script>', '<script src="./js/v1220-runtime.js?v=12.20"></script>\n<script type="module" src="./js/v12-glass.js"></script>')
          html = re.sub(r'(<title>[^<]*Editorial OS )V12\.9(</title>)', r'\1V12.20\2', html, count=1)
          html = html.replace('<link rel="manifest" href="manifest.webmanifest">', '<link rel="manifest" href="manifest.webmanifest?v=12.20">')
          index.write_text(html, encoding='utf-8')

          manifest_path = Path('manifest.webmanifest')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['name'] = 'Editorial OS V12.20'
          manifest['description'] = 'Editorial OS V12.20 iPhone-first: abre la interfaz local primero y conecta Supabase y servicios secundarios después sin bloquear el uso.'
          manifest['start_url'] = './?pwa=1&v=12.20'
          manifest['scope'] = './'
          manifest['shortcuts'] = [
              {'name':'Inicio','short_name':'Inicio','url':'./?pwa=1&v=12.20&go=home','icons':[{'src':'icons/icon-192.png','sizes':'192x192','type':'image/png'}]},
              {'name':'Calendario','short_name':'Calendario','url':'./?pwa=1&v=12.20&go=calendar','icons':[{'src':'icons/icon-192.png','sizes':'192x192','type':'image/png'}]},
              {'name':'Planificador','short_name':'Plan','url':'./?pwa=1&iphone=1&v=12.20&go=emulator','icons':[{'src':'icons/icon-192.png','sizes':'192x192','type':'image/png'}]}
          ]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw = re.sub(r"const CACHE='editorial-os-v12-[^']+';", "const CACHE='editorial-os-v12-20';", sw, count=1)
          extra = "  './js/v1220-bootstrap.js','./js/v1220-runtime.js','./css/v1220.css','./vendor/sortable.min.js','./vendor/supabase.min.js',\n"
          if './vendor/supabase.min.js' not in sw:
              sw = sw.replace('const ASSETS=[\n', 'const ASSETS=[\n' + extra, 1)
          sw_path.write_text(sw, encoding='utf-8')

      - name: Validate production patch
        shell: bash
        run: |
          set -euo pipefail
          node --check js/v1220-bootstrap.js
          node --check js/v1220-runtime.js
          python - <<'PY'
          from pathlib import Path
          import json
          html=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          manifest=json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          assert 'v1220-bootstrap.js?v=12.20' in html
          assert 'v1220-runtime.js?v=12.20' in html
          assert 'css/v1220.css?v=12.20' in html
          assert 'https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js' not in html
          assert 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2' not in html
          assert './vendor/sortable.min.js' in sw
          assert './vendor/supabase.min.js' in sw
          assert manifest.get('start_url') == './?pwa=1&v=12.20'
          assert Path('vendor/sortable.min.js').stat().st_size > 10000
          assert Path('vendor/supabase.min.js').stat().st_size > 50000
          print('V12.20 validation OK')
          PY

      - name: Commit production patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain vendor)" ]; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest sw.js vendor/sortable.min.js vendor/supabase.min.js
          git commit -m 'Editorial OS V12.20 - ship iPhone first PWA boot'
          git push origin HEAD:main
