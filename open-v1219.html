<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="refresh" content="3;url=./?v=12.19&fallback=1">
<title>Editorial OS · Abrir</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080a0f;color:#f7f8fb;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif}body{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 15%,rgba(60,145,255,.16),transparent 30%),radial-gradient(circle at 78% 76%,rgba(195,255,74,.09),transparent 28%),#080a0f}.card{width:min(430px,100%);text-align:center}.mark{width:70px;height:70px;margin:0 auto 22px;border-radius:22px;display:grid;place-items:center;background:#f5f7fb;color:#080a0f;font-size:34px;font-weight:950}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.13em;color:#91a0b8}.card h1{margin:9px 0 10px;font-size:clamp(34px,9vw,52px);line-height:.98;letter-spacing:-.055em}.card p{margin:0;color:#a7b1c3;font-size:15px;line-height:1.5}.bar{height:6px;margin:26px 0 12px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden}.bar i{display:block;width:35%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#6befff,#d9ff5c);animation:move 1s ease-in-out infinite alternate}.status{font-size:12px;color:#a7b1c3}.direct{display:inline-flex;margin-top:18px;min-height:44px;padding:0 18px;border-radius:13px;align-items:center;justify-content:center;background:#fff;color:#111;text-decoration:none;font-size:13px;font-weight:850}@keyframes move{to{transform:translateX(185%)}}@media(prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style>
</head>
<body>
<main class="card">
  <div class="mark">J</div>
  <div class="eyebrow">EDITORIAL OS · V12.19</div>
  <h1>Abriendo la app.</h1>
  <p>Limpiando únicamente la caché técnica antigua. Tus datos locales y Supabase no se borran.</p>
  <div class="bar"><i></i></div>
  <div id="status" class="status">Preparando una carga limpia…</div>
  <a class="direct" href="./?v=12.19&direct=1">Entrar directamente</a>
</main>
<script>
(function(){
  var done=false;
  function go(){if(done)return;done=true;location.replace('./?v=12.19&fresh='+Date.now());}
  async function clean(){
    try{
      if('serviceWorker' in navigator){
        var regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.filter(function(r){return String(r.scope||'').indexOf('/editorial-os/')!==-1;}).map(function(r){return r.unregister();}));
      }
      if(window.caches&&caches.keys){
        var keys=await caches.keys();
        await Promise.all(keys.filter(function(k){return /^editorial-os-/i.test(k);}).map(function(k){return caches.delete(k);}));
      }
      var s=document.getElementById('status');if(s)s.textContent='Caché técnica lista · entrando…';
    }catch(e){
      var s=document.getElementById('status');if(s)s.textContent='Entrando sin esperar servicios externos…';
    }
    go();
  }
  clean();
  setTimeout(go,1400);
})();
</script>
</body>
</html>
